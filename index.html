<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrimeVision AI - Intelligent Multimodal Forensic Analysis Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        forensic: {
                            900: '#090d16',
                            800: '#111827',
                            700: '#1f2937',
                            600: '#374151',
                            500: '#4b5563',
                            accent: '#3b82f6',
                            danger: '#ef4444',
                            warning: '#f59e0b',
                            success: '#10b981',
                            cyan: '#06b6d4'
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & Babel CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        /* Custom scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    </style>
</head>
<body class="bg-forensic-900 text-gray-100 min-h-screen selection:bg-blue-600 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Toast Notification Component
        function Notification({ message, type, onClose }) {
            useEffect(() => {
                const timer = setTimeout(onClose, 4000);
                return () => clearTimeout(timer);
            }, [message]);

            const bg = type === 'error' ? 'bg-red-900 border-red-700 text-red-200' : 
                       type === 'success' ? 'bg-emerald-900 border-emerald-700 text-emerald-200' : 
                       'bg-blue-900 border-blue-700 text-blue-200';

            return (
                <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl border shadow-2xl flex items-center space-x-3 transition-all duration-300 animate-bounce ${bg}`}>
                    <i className={`fas ${type === 'error' ? 'fa-exclamation-triangle' : type === 'success' ? 'fa-check-circle' : 'fa-info-circle'} text-lg`}></i>
                    <span className="text-sm font-medium">{message}</span>
                    <button onClick={onClose} className="ml-3 text-xs opacity-70 hover:opacity-100"><i className="fas fa-times"></i></button>
                </div>
            );
        }

        // Main App Component
        function App() {
            // Configuration & Security State
            const [apiKey, setApiKey] = useState('');
            const [modelProvider, setModelProvider] = useState('Groq (Llama-3-Vision)');
            const [isDemoFallback, setIsDemoFallback] = useState(true);
            const [investigatorName, setInvestigatorName] = useState('Det. Sarah Jenkins (Badge #4092)');
            const [evidenceId, setEvidenceId] = useState('EV-2026-9084X');
            const [caseTimestamp, setCaseTimestamp] = useState(new Date().toISOString().slice(0, 19).replace('T', ' '));
            
            // Navigation & UI State
            const [activeTab, setActiveTab] = useState('tagger');
            const [notification, setNotification] = useState(null);
            const [isAnalyzing, setIsAnalyzing] = useState(false);

            // Tab 1: Visual Evidence Tagger State
            const [selectedImage, setSelectedImage] = useState('https://placehold.co/800x500/1e293b/cbd5e1?text=Crime+Scene:+Apartment+4B+-+Living+Room');
            const [detectionResults, setDetectionResults] = useState(null);

            // Tab 2: Audio Transcription State
            const [selectedAudio, setSelectedAudio] = useState('Emergency_Call_911_Audio_Stream.wav');
            const [audioTranscribed, setAudioTranscribed] = useState(false);

            // Tab 3: CCTV Video Analysis State
            const [selectedVideo, setSelectedVideo] = useState('CCTV_Alleyway_Cam_04_Rec.mp4');
            const [videoProcessed, setVideoProcessed] = useState(false);

            // Tab 4: Multimodal Fusion & Chat State
            const [chatQuery, setChatQuery] = useState('');
            const [chatMessages, setChatMessages] = useState([
                { role: 'system', content: 'Forensic Knowledge Graph Initialized. All evidence items cross-indexed with Chain-of-Custody ID EV-2026-9084X.' },
                { role: 'assistant', content: 'Hello Detective Jenkins. I have loaded 3 visual detections, 2 audio transcript segments, and 4 CCTV track vectors into the secure RAG index. How can I assist your investigation today?' }
            ]);

            // Trigger notification
            const notify = (message, type = 'info') => setNotification({ message, type });

            // Run simulated analysis
            const runAnalysis = (tabName) => {
                setIsAnalyzing(true);
                notify(`Executing deep forensic inference pipeline for ${tabName}...`, 'info');
                setTimeout(() => {
                    setIsAnalyzing(false);
                    if (tabName === 'Visual Evidence') {
                        setDetectionResults({
                            threatLevel: 'Critical',
                            classification: 'Homicide / Aggravated Burglary',
                            confidence: '98.4%',
                            objects: [
                                { id: 'OBJ-01', name: 'Firearm (9mm Glock)', confidence: '99.1%', bbox: '[312, 450, 410, 520]', impact: 'Primary Weapon' },
                                { id: 'OBJ-02', name: 'Blood Spatter Pattern (Low-Velocity Impact)', confidence: '96.8%', bbox: '[120, 200, 290, 350]', impact: 'Point of Origin' },
                                { id: 'OBJ-03', name: 'Forced Entry Tool Marks on Doorframe', confidence: '94.5%', bbox: '[50, 80, 210, 140]', impact: 'Entry Vector' },
                                { id: 'OBJ-04', name: 'Suspect Footwear Impression (Size 11 Vibram)', confidence: '97.2%', bbox: '[620, 510, 700, 600]', impact: 'Trace Evidence' }
                            ],
                            leads: [
                                'Match 9mm firearm ballistic rifling with national IBIN database.',
                                'Extract DNA from blood spatter droplet #2 for STR profiling.',
                                'Pull CCTV footage from exterior north alley matching footwear sole pattern.'
                            ]
                        });
                        notify('Visual object detection & scene classification complete.', 'success');
                    } else if (tabName === 'Audio Transcription') {
                        setAudioTranscribed(true);
                        notify('Witness audio diarization & timeline extraction complete.', 'success');
                    } else if (tabName === 'CCTV Processing') {
                        setVideoProcessed(true);
                        notify('CCTV trajectory tracking and legal penal classification complete.', 'success');
                    }
                }, 1500);
            };

            // Handle Chat Send
            const handleSendChat = (e) => {
                e.preventDefault();
                if (!chatQuery.trim()) return;
                const userMsg = chatQuery;
                setChatMessages(prev => [...prev, { role: 'user', content: userMsg }]);
                setChatQuery('');

                setTimeout(() => {
                    let reply = "Based on cross-modal verification with Evidence ID EV-2026-9084X: ";
                    const q = userMsg.toLowerCase();
                    if (q.includes('weapon') || q.includes('gun')) {
                        reply += "Yes. Visual detection OBJ-01 identifies a 9mm Glock on the coffee table at 22:14:02 UTC. Audio segment [00:41] corroborates witness statement: 'He pulled out a black handgun immediately upon entry.'";
                    } else if (q.includes('suspect') || q.includes('vehicle')) {
                        reply += "CCTV tracking Vector #3 indicates a dark sedan departing east at 22:18:45 UTC with license plate sequence partial [CA-7X9*].";
                    } else {
                        reply += `I analyzed the query against all synchronized streams. The timeline confirms sequence coherence between CCTV cam 04 and audio distress call at timestamp 22:13:50.`;
                    }
                    setChatMessages(prev => [...prev, { role: 'assistant', content: reply }]);
                }, 1000);
            };

            return (
                <div className="flex flex-col min-h-screen bg-forensic-900 text-gray-100">
                    {/* Top Navigation Bar & Chain of Custody Header */}
                    <header className="bg-forensic-800 border-b border-forensic-700 sticky top-0 z-40 px-4 py-3 shadow-lg">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center space-x-3">
                                <div className="bg-blue-600 p-2.5 rounded-xl shadow-lg shadow-blue-900/40 text-white">
                                    <i className="fas fa-fingerprint text-xl"></i>
                                </div>
                                <div>
                                    <h1 className="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                                        CrimeVision AI <span className="text-xs bg-blue-500/20 text-blue-400 border border-blue-500/30 px-2 py-0.5 rounded-full font-mono">v2.4 Capstone</span>
                                    </h1>
                                    <p className="text-xs text-gray-400">Intelligent Multimodal Forensic Analysis Platform</p>
                                </div>
                            </div>

                            {/* Chain of Custody Metadata Indicators */}
                            <div className="flex flex-wrap items-center gap-2 text-xs">
                                <div className="bg-forensic-700/80 border border-forensic-600 px-3 py-1.5 rounded-lg flex items-center space-x-2">
                                    <i className="fas fa-barcode text-cyan-400"></i>
                                    <span className="text-gray-400">Evidence ID:</span>
                                    <span className="font-mono font-bold text-gray-200">{evidenceId}</span>
                                </div>
                                <div className="bg-forensic-700/80 border border-forensic-600 px-3 py-1.5 rounded-lg flex items-center space-x-2">
                                    <i className="fas fa-clock text-amber-400"></i>
                                    <span className="text-gray-400">Timestamp:</span>
                                    <span className="font-mono text-gray-200">{caseTimestamp}</span>
                                </div>
                                <div className="bg-forensic-700/80 border border-forensic-600 px-3 py-1.5 rounded-lg flex items-center space-x-2">
                                    <i className="fas fa-user-shield text-emerald-400"></i>
                                    <span className="text-gray-400">Sign-off:</span>
                                    <span className="font-medium text-gray-200">{investigatorName}</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Layout */}
                    <div className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 flex flex-col gap-6">
                        
                        {/* Configuration & Security Bar (Collapsible/Card) */}
                        <div className="bg-forensic-800/90 border border-forensic-700 rounded-2xl p-4 shadow-xl backdrop-blur-md">
                            <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                                <div className="flex items-center space-x-3">
                                    <div className="bg-forensic-700 p-2 rounded-lg text-amber-400">
                                        <i className="fas fa-shield-alt"></i>
                                    </div>
                                    <div>
                                        <h3 className="text-sm font-semibold text-gray-200">Security & Model Configuration</h3>
                                        <p className="text-xs text-gray-400">Secure API Gateway & Chain-of-Custody Integrity Check</p>
                                    </div>
                                </div>

                                <div className="flex flex-wrap items-center gap-3 w-full lg:w-auto">
                                    <div className="flex-1 lg:w-64">
                                        <input 
                                            type="password" 
                                            placeholder="Enter Groq / Gemini API Key..." 
                                            value={apiKey}
                                            onChange={(e) => {
                                                setApiKey(e.target.value);
                                                setIsDemoFallback(!e.target.value);
                                            }}
                                            className="w-full bg-forensic-900 border border-forensic-600 rounded-xl px-3 py-2 text-xs text-gray-200 focus:outline-none focus:border-blue-500 font-mono"
                                        />
                                    </div>
                                    <select 
                                        value={modelProvider} 
                                        onChange={(e) => setModelProvider(e.target.value)}
                                        className="bg-forensic-900 border border-forensic-600 rounded-xl px-3 py-2 text-xs text-gray-200 focus:outline-none focus:border-blue-500"
                                    >
                                        <option>Groq (Llama-3-Vision)</option>
                                        <option>Google Gemini 1.5 Pro</option>
                                        <option>Local Forensic LLM (Offline)</option>
                                    </select>
                                    <div className={`px-3 py-2 rounded-xl text-xs font-semibold flex items-center space-x-1.5 border ${isDemoFallback ? 'bg-amber-950/40 text-amber-400 border-amber-800/60' : 'bg-emerald-950/40 text-emerald-400 border-emerald-800/60'}`}>
                                        <span className={`w-2 h-2 rounded-full ${isDemoFallback ? 'bg-amber-400 animate-pulse' : 'bg-emerald-400'}`}></span>
                                        <span>{isDemoFallback ? 'Demo Fallback Active' : 'Secure API Connected'}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Tabs Navigation */}
                        <div className="flex space-x-1 bg-forensic-800/80 p-1.5 rounded-2xl border border-forensic-700 overflow-x-auto shadow-md">
                            {[
                                { id: 'tagger', label: '1. Visual Evidence Tagger', icon: 'fa-camera-retro' },
                                { id: 'audio', label: '2. Witness Audio & Timeline', icon: 'fa-microphone-alt' },
                                { id: 'video', label: '3. CCTV Event Progression', icon: 'fa-video' },
                                { id: 'fusion', label: '4. Multimodal Fusion & Chat', icon: 'fa-brain' },
                                { id: 'export', label: '5. Automated Forensic PDF', icon: 'fa-file-pdf' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex items-center space-x-2 px-4 py-2.5 rounded-xl text-xs font-medium transition-all duration-200 whitespace-nowrap ${activeTab === tab.id ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30 font-semibold' : 'text-gray-400 hover:text-gray-200 hover:bg-forensic-700/50'}`}
                                >
                                    <i className={`fas ${tab.icon}`}></i>
                                    <span>{tab.label}</span>
                                </button>
                            ))}
                        </div>

                        {/* TAB 1: CRIME SCENE VISUAL EVIDENCE TAGGER */}
                        {activeTab === 'tagger' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-fadeIn">
                                <div className="lg:col-span-2 bg-forensic-800 border border-forensic-700 rounded-2xl p-6 shadow-xl flex flex-col gap-4">
                                    <div className="flex justify-between items-center">
                                        <h2 className="text-base font-bold text-gray-100 flex items-center gap-2">
                                            <i className="fas fa-image text-blue-400"></i> Crime Scene Photography & RT-DETR Detection
                                        </h2>
                                        <button 
                                            onClick={() => runAnalysis('Visual Evidence')}
                                            disabled={isAnalyzing}
                                            className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-lg shadow-blue-600/30 flex items-center space-x-2 transition-all disabled:opacity-50"
                                        >
                                            <i className={`fas ${isAnalyzing ? 'fa-spinner fa-spin' : 'fa-wand-magic-sparkles'}`}></i>
                                            <span>{isAnalyzing ? 'Processing RT-DETR...' : 'Run Forensic Object Detection'}</span>
                                        </button>
                                    </div>

                                    {/* Image Preview Box with Simulated Bounding Boxes */}
                                    <div className="relative rounded-xl overflow-hidden border border-forensic-600 bg-black/40 group aspect-video flex items-center justify-center">
                                        <img src={selectedImage} alt="Crime Scene" className="w-full h-full object-cover opacity-90 group-hover:scale-105 transition-transform duration-500" />
                                        
                                        {/* Overlay Bounding Boxes if analyzed */}
                                        {detectionResults && (
                                            <>
                                                <div className="absolute top-[30%] left-[45%] w-24 h-20 border-2 border-red-500 bg-red-500/10 rounded flex items-start p-1 animate-pulse">
                                                    <span className="bg-red-600 text-white text-[9px] px-1 rounded font-mono">Glock 9mm (99.1%)</span>
                                                </div>
                                                <div className="absolute top-[15%] left-[20%] w-36 h-28 border-2 border-amber-500 bg-amber-500/10 rounded flex items-start p-1">
                                                    <span className="bg-amber-600 text-white text-[9px] px-1 rounded font-mono">Blood Spatter (96.8%)</span>
                                                </div>
                                            </>
                                        )}

                                        <div className="absolute bottom-3 left-3 bg-black/70 backdrop-blur-md px-3 py-1.5 rounded-lg border border-forensic-600 text-xs font-mono text-gray-300">
                                            Source: /evidence/crime_scene_4b_01.jpg (Resolution: 4032x3024)
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-3 gap-3">
                                        <div className="bg-forensic-900 border border-forensic-700 p-3 rounded-xl">
                                            <span className="text-[10px] uppercase tracking-wider text-gray-400 font-medium">Uploader Source</span>
                                            <p className="text-xs font-semibold text-gray-200 mt-0.5 truncate">Sony Alpha 7R IV (Forensic Unit)</p>
                                        </div>
                                        <div className="bg-forensic-900 border border-forensic-700 p-3 rounded-xl">
                                            <span className="text-[10px] uppercase tracking-wider text-gray-400 font-medium">Model Engine</span>
                                            <p className="text-xs font-semibold text-gray-200 mt-0.5">RT-DETR ResNet-50 Custom</p>
                                        </div>
                                        <div className="bg-forensic-900 border border-forensic-700 p-3 rounded-xl">
                                            <span className="text-[10px] uppercase tracking-wider text-gray-400 font-medium">EXIF Data Status</span>
                                            <p className="text-xs font-semibold text-emerald-400 mt-0.5">Verified Intact (SHA-256)</p>
                                        </div>
                                    </div>
                                </div>

                                {/* Structured Forensic Output Panel */}
                                <div className="bg-forensic-800 border border-forensic-700 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
                                    <div>
                                        <h3 className="text-sm font-bold text-gray-200 mb-4 flex items-center gap-2">
                                            <i className="fas fa-file-contract text-cyan-400"></i> Structured Forensic Assessment
                                        </h3>

                                        {detectionResults ? (
                                            <div className="space-y-4">
                                                <div className="grid grid-cols-2 gap-3">
                                                    <div className="bg-red-950/40 border border-red-800/50 p-3 rounded-xl">
                                                        <span className="text-[10px] text-red-400 font-medium uppercase">Threat Level</span>
                                                        <p className="text-sm font-bold text-red-200 mt-0.5 flex items-center gap-1.5">
                                                            <i className="fas fa-triangle-exclamation"></i> {detectionResults.threatLevel}
                                                        </p>
                                                    </div>
                                                    <div className="bg-blue-950/40 border border-blue-800/50 p-3 rounded-xl">
                                                        <span className="text-[10px] text-blue-400 font-medium uppercase">Scene Class</span>
                                                        <p className="text-xs font-bold text-blue-200 mt-0.5">{detectionResults.classification}</p>
                                                    </div>
                                                </div>

                                                <div>
                                                    <span className="text-xs font-semibold text-gray-400 mb-2 block">Detected Forensic Items</span>
                                                    <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                                                        {detectionResults.objects.map((obj, i) => (
                                                            <div key={i} className="bg-forensic-900 border border-forensic-700 p-2.5 rounded-xl flex justify-between items-center text-xs">
                                                                <div>
                                                                    <span className="font-bold text-gray-200">{obj.name}</span>
                                                                    <span className="text-[10px] text-gray-400 block font-mono">BBox: {obj.bbox}</span>
                                                                </div>
                                                                <span className="bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded font-mono text-[10px]">{obj.confidence}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>

                                                <div>
                                                    <span className="text-xs font-semibold text-gray-400 mb-2 block">Prioritized Investigative Leads</span>
                                                    <ul className="space-y-1.5 text-xs text-gray-300">
                                                        {detectionResults.leads.map((lead, i) => (
                                                            <li key={i} className="flex items-start gap-2 bg-forensic-900/60 p-2 rounded-lg border border-forensic-700/50">
                                                                <i className="fas fa-angles-right text-blue-400 mt-0.5"></i>
                                                                <span>{lead}</span>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="text-center py-16 text-gray-500">
                                                <i className="fas fa-microscope text-4xl mb-3 opacity-40"></i>
                                                <p className="text-xs">Click "Run Forensic Object Detection" above to initiate RT-DETR analysis and generate structured threat reporting.</p>
                                            </div>
                                        )}
                                    </div>

                                    <div className="mt-6 pt-4 border-t border-forensic-700 flex justify-between items-center text-xs text-gray-400">
                                        <span>Chain ID: EV-2026-01</span>
                                        <span className="text-emerald-400 font-mono"><i className="fas fa-check-circle"></i> Cryptographic Seal OK</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: WITNESS AUDIO TRANSCRIPTION & TIMELINE */}
                        {activeTab === 'audio' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-fadeIn">
                                <div className="bg-forensic-800 border border-forensic-700 rounded-2xl p-6 shadow-xl flex flex-col gap-4">
                                    <div className="flex justify-between items-center">
                                        <h2 className="text-base font-bold text-gray-100 flex items-center gap-2">
                                            <i className="fas fa-file-audio text-emerald-400"></i> Audio Stream & 911 Dispatch Intake
                                        </h2>
                                        <button 
                                            onClick={() => runAnalysis('Audio Transcription')}
                                            disabled={isAnalyzing}
                                            className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-lg shadow-emerald-600/30 flex items-center space-x-2 transition-all disabled:opacity-50"
                                        >
                                            <i className={`fas ${isAnalyzing ? 'fa-spinner fa-spin' : 'fa-headphones'}`}></i>
                                            <span>{isAnalyzing ? 'Transcribing...' : 'Run Whisper Audio Diarization'}</span>
                                        </button>
                                    </div>

                                    <div className="bg-forensic-900 border border-forensic-700 rounded-xl p-4 flex flex-col gap-3">
                                        <div className="flex items-center justify-between text-xs text-gray-300">
                                            <span className="font-mono">{selectedAudio}</span>
                                            <span className="text-emerald-400">03:42 min / WAV 16kHz</span>
                                        </div>
                                        {/* Simulated Waveform Bar */}
                                        <div className="h-16 flex items-center justify-between gap-0.5 px-2 bg-forensic-800 rounded-lg">
                                            {[40, 60, 20, 80, 95, 30, 45, 70, 85, 90, 50, 40, 75, 85, 60, 40, 20, 90, 100, 70, 50, 30, 65, 80, 45].map((h, i) => (
                                                <div key={i} style={{ height: `${h}%` }} className="w-1.5 bg-emerald-500/70 rounded-full"></div>
                                            ))}
                                        </div>
                                        <div className="flex justify-between items-center text-[10px] text-gray-400 font-mono">
                                            <span>00:00</span>
                                            <span>Audio Fingerprint: SHA256-88F3A2...</span>
                                            <span>03:42</span>
                                        </div>
                                    </div>

                                    <div className="bg-forensic-900 border border-forensic-700 p-4 rounded-xl space-y-2">
                                        <span className="text-xs font-bold text-gray-200 block">Acoustic Noise Profile</span>
                                        <div className="flex justify-between text-xs text-gray-400">
                                            <span>Signal-to-Noise Ratio (SNR):</span>
                                            <span className="text-emerald-400 font-mono">+24.5 dB (Clean)</span>
                                        </div>
                                        <div className="flex justify-between text-xs text-gray-400">
                                            <span>Speaker Separation:</span>
                                            <span className="text-blue-400 font-mono">2 Speakers (Dispatcher + Caller)</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="lg:col-span-2 bg-forensic-800 border border-forensic-700 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
                                    <div>
                                        <h3 className="text-sm font-bold text-gray-200 mb-4 flex items-center gap-2">
                                            <i className="fas fa-timeline text-cyan-400"></i> Diarized Transcript & Chronological Markers
                                        </h3>

                                        {audioTranscribed ? (
                                            <div className="space-y-3 max-h-[380px] overflow-y-auto pr-2">
                                                {[
                                                    { time: '00:05.12', speaker: 'Dispatcher (Agent 49)', text: '911 emergency, what is your location and nature of emergency?', type: 'system' },
                                                    { time: '00:12.40', speaker: 'Caller (Witness A)', text: 'Help! Please send police to 412 Maple Street Apartment 4B. Someone just forced the front door open!', type: 'danger' },
                                                    { time: '00:24.18', speaker: 'Dispatcher (Agent 49)', text: 'Remain calm. Do you see any weapons or suspects inside the residence?', type: 'system' },
                                                    { time: '00:31.90', speaker: 'Caller (Witness A)', text: 'Yes! He pulled out a black handgun. He is wearing a dark hoodie and ski mask. He went toward the bedroom!', type: 'danger' },
                                                    { time: '00:45.02', speaker: 'Ambient Audio', text: '[Loud metallic crash followed by two rapid acoustic impulses consistent with firearm discharge at 22:13:58 UTC]', type: 'audio' }
                                                ].map((seg, i) => (
                                                    <div key={i} className={`p-3 rounded-xl border text-xs ${seg.type === 'danger' ? 'bg-red-950/30 border-red-800/40 text-red-200' : seg.type === 'audio' ? 'bg-amber-950/30 border-amber-800/40 text-amber-200' : 'bg-forensic-900 border-forensic-700 text-gray-300'}`}>
                                                        <div className="flex justify-between items-center mb-1">
                                                            <span className="font-bold text-gray-200">{seg.speaker}</span>
                                                            <span className="font-mono text-[10px] text-cyan-400 bg-cyan-950/50 px-2 py-0.5 rounded border border-cyan-800/40">{seg.time}</span>
                                                        </div>
                                                        <p className="font-mono text-xs">{seg.text}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        ) : (
                                            <div className="text-center py-20 text-gray-500">
                                                <i className="fas fa-comment-slash text-4xl mb-3 opacity-40"></i>
                                                <p className="text-xs">Run Whisper Audio Diarization above to extract speaker tags and timestamped forensic markers.</p>
                                            </div>
                                        )}
                                    </div>

                                    <div className="mt-6 pt-4 border-t border-forensic-700 flex justify-between items-center text-xs text-gray-400">
                                        <span>Evidence ID: EV-2026-9084X</span>
                                        <span className="text-emerald-400"><i className="fas fa-shield-check"></i> Court Admissible Format</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 3: CCTV VIDEO ANALYSIS & EVENT PROGRESSION */}
                        {activeTab === 'video' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-fadeIn">
                                <div className="bg-forensic-800 border border-forensic-700 rounded-2xl p-6 shadow-xl flex flex-col gap-4">
                                    <div className="flex justify-between items-center">
                                        <h2 className="text-base font-bold text-gray-100 flex items-center gap-2">
                                            <i className="fas fa-video text-blue-400"></i> CCTV Frame Sampler & Tracker
                                        </h2>
                                        <button 
                                            onClick={() => runAnalysis('CCTV Processing')}
                                            disabled={isAnalyzing}
                                            className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-lg shadow-blue-600/30 flex items-center space-x-2 transition-all disabled:opacity-50"
                                        >
                                            <i className={`fas ${isAnalyzing ? 'fa-spinner fa-spin' : 'fa-play'}`}></i>
                                            <span>{isAnalyzing ? 'Tracking Vectors...' : 'Process Video Frames'}</span>
                                        </button>
                                    </div>

                                    <div className="relative rounded-xl overflow-hidden border border-forensic-600 bg-black/40 aspect-video flex items-center justify-center">
                                        <img src="https://placehold.co/800x450/090d16/3b82f6?text=CCTV+Feed:+Alleyway+North+Camera+04" alt="CCTV Feed" className="w-full h-full object-cover" />
                                        
                                        {videoProcessed && (
                                            <div className="absolute inset-0 bg-blue-900/10 border-2 border-blue-500/40 flex items-center justify-center">
                                                <div className="absolute top-4 left-4 bg-black/80 px-3 py-1 rounded border border-blue-500 text-[10px] font-mono text-blue-400">
                                                    TARGET_ID: #SUSPECT_01 [TRAJECTORY LOCK]
                                                </div>
                                                <div className="w-32 h-32 border-2 border-dashed border-red-500 rounded-full animate-spin"></div>
                                            </div>
                                        )}

                                        <div className="absolute bottom-3 left-3 bg-black/70 backdrop-blur-md px-3 py-1.5 rounded-lg border border-forensic-600 text-xs font-mono text-gray-300">
                                            CAM_ID: 04_NORTH_ALLEY | 30 FPS
                                        </div>
                                    </div>

                                    <div className="bg-forensic-900 border border-forensic-700 p-4 rounded-xl space-y-2">
                                        <span className="text-xs font-bold text-gray-200 block">Spatial Trajectory Stats</span>
                                        <div className="flex justify-between text-xs text-gray-400">
                                            <span>Vector Velocity:</span>
                                            <span className="text-cyan-400 font-mono">4.2 m/s (Sprinting East)</span>
                                        </div>
                                        <div className="flex justify-between text-xs text-gray-400">
                                            <span>Vehicle Match:</span>
                                            <span className="text-amber-400 font-mono">Dark Sedan (Model: 2021 Civic)</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="lg:col-span-2 bg-forensic-800 border border-forensic-700 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
                                    <div>
                                        <h3 className="text-sm font-bold text-gray-200 mb-4 flex items-center gap-2">
                                            <i className="fas fa-table text-cyan-400"></i> Chronological Event Log & Legal Penal Categories
                                        </h3>

                                        {videoProcessed ? (
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-left text-xs">
                                                    <thead className="bg-forensic-900 text-gray-400 uppercase font-mono text-[10px] border-b border-forensic-700">
                                                        <tr>
                                                            <th className="p-3">Timestamp</th>
                                                            <th className="p-3">Event Description</th>
                                                            <th className="p-3">Penal Code Classification</th>
                                                            <th className="p-3">Confidence</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-forensic-700/50 font-mono">
                                                        <tr>
                                                            <td className="p-3 text-cyan-400">22:12:10 UTC</td>
                                                            <td className="p-3 text-gray-200">Suspect approaches door with crowbar</td>
                                                            <td className="p-3 text-amber-400">PC 459 - First Degree Burglary</td>
                                                            <td className="p-3 text-emerald-400">97.8%</td>
                                                        </tr>
                                                        <tr>
                                                            <td className="p-3 text-cyan-400">22:13:58 UTC</td>
                                                            <td className="p-3 text-gray-200">Forcible entry & weapon drawn</td>
                                                            <td className="p-3 text-red-400">PC 211 - Armed Robbery / Assault</td>
                                                            <td className="p-3 text-emerald-400">99.2%</td>
                                                        </tr>
                                                        <tr>
                                                            <td className="p-3 text-cyan-400">22:18:45 UTC</td>
                                                            <td className="p-3 text-gray-200">Suspect flees to dark sedan eastwards</td>
                                                            <td className="p-3 text-blue-400">PC 32 - Accessory / Flight</td>
                                                            <td className="p-3 text-emerald-400">95.4%</td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        ) : (
                                            <div className="text-center py-20 text-gray-500">
                                                <i className="fas fa-video-slash text-4xl mb-3 opacity-40"></i>
                                                <p className="text-xs">Process video frames to extract suspect trajectories and legal penal classifications.</p>
                                            </div>
                                        )}
                                    </div>

                                    <div className="mt-6 pt-4 border-t border-forensic-700 flex justify-between items-center text-xs text-gray-400">
                                        <span>Source: CCTV Cam 04 Master Archive</span>
                                        <span className="text-emerald-400 font-mono"><i className="fas fa-shield-check"></i> Integrity Validated</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 4: MULTIMODAL FUSION & GROUNDED EVIDENCE CHAT */}
                        {activeTab === 'fusion' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-fadeIn">
                                <div className="bg-forensic-800 border border-forensic-700 rounded-2xl p-6 shadow-xl flex flex-col gap-4">
                                    <h3 className="text-sm font-bold text-gray-200 flex items-center gap-2">
                                        <i className="fas fa-layer-group text-purple-400"></i> Master Forensic Event Ledger
                                    </h3>
                                    <div className="space-y-3 text-xs">
                                        <div className="bg-forensic-900 border border-forensic-700 p-3 rounded-xl">
                                            <div className="flex justify-between text-gray-400 font-mono text-[10px] mb-1">
                                                <span>STREAM: VISUAL</span>
                                                <span className="text-emerald-400">EV-01</span>
                                            </div>
                                            <p className="text-gray-200 font-medium">Glock 9mm firearm & blood spatter detected in living room.</p>
                                        </div>
                                        <div className="bg-forensic-900 border border-forensic-700 p-3 rounded-xl">
                                            <div className="flex justify-between text-gray-400 font-mono text-[10px] mb-1">
                                                <span>STREAM: AUDIO</span>
                                                <span className="text-emerald-400">EV-02</span>
                                            </div>
                                            <p className="text-gray-200 font-medium">911 call transcript confirms armed intruder statement at 22:13 UTC.</p>
                                        </div>
                                        <div className="bg-forensic-900 border border-forensic-700 p-3 rounded-xl">
                                            <div className="flex justify-between text-gray-400 font-mono text-[10px] mb-1">
                                                <span>STREAM: CCTV</span>
                                                <span className="text-emerald-400">EV-03</span>
                                            </div>
                                            <p className="text-gray-200 font-medium">Suspect trajectory tracked sprinting east to getaway sedan.</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="lg:col-span-2 bg-forensic-800 border border-forensic-700 rounded-2xl p-6 shadow-xl flex flex-col justify-between h-[520px]">
                                    <div className="flex justify-between items-center border-b border-forensic-700 pb-3">
                                        <h3 className="text-sm font-bold text-gray-200 flex items-center gap-2">
                                            <i className="fas fa-robot text-blue-400"></i> Grounded RAG Forensic Investigator Chat
                                        </h3>
                                        <span className="text-[10px] font-mono text-emerald-400 bg-emerald-950 px-2 py-0.5 rounded border border-emerald-800">Zero Hallucination Mode</span>
                                    </div>

                                    {/* Chat Messages */}
                                    <div className="flex-1 overflow-y-auto space-y-3 py-4 pr-2">
                                        {chatMessages.map((msg, i) => (
                                            <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                <div className={`max-w-[85%] p-3.5 rounded-2xl text-xs font-mono leading-relaxed ${msg.role === 'user' ? 'bg-blue-600 text-white rounded-br-none shadow-lg' : msg.role === 'system' ? 'bg-forensic-900 border border-forensic-700 text-gray-400 text-center w-full' : 'bg-forensic-900 border border-forensic-700 text-gray-200 rounded-bl-none shadow'}`}>
                                                    {msg.content}
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    {/* Input Bar */}
                                    <form onSubmit={handleSendChat} className="flex gap-2 pt-3 border-t border-forensic-700">
                                        <input 
                                            type="text" 
                                            placeholder="Interrogate evidence (e.g., 'Was a weapon visible before the suspect fled?')..."
                                            value={chatQuery}
                                            onChange={(e) => setChatQuery(e.target.value)}
                                            className="flex-1 bg-forensic-900 border border-forensic-600 rounded-xl px-4 py-2.5 text-xs text-gray-200 focus:outline-none focus:border-blue-500 font-mono"
                                        />
                                        <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-xl text-xs font-semibold shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center">
                                            <i className="fas fa-paper-plane"></i>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* TAB 5: AUTOMATED FORENSIC PDF EXPORT */}
                        {activeTab === 'export' && (
                            <div className="bg-forensic-800 border border-forensic-700 rounded-2xl p-8 shadow-xl max-w-4xl mx-auto w-full animate-fadeIn">
                                <div className="text-center max-w-lg mx-auto mb-8">
                                    <div className="w-16 h-16 bg-blue-600/20 border border-blue-500/40 rounded-2xl mx-auto flex items-center justify-center text-blue-400 mb-4 shadow-xl">
                                        <i className="fas fa-file-pdf text-2xl"></i>
                                    </div>
                                    <h2 className="text-xl font-bold text-white">Automated Court-Admissible Forensic Report</h2>
                                    <p className="text-xs text-gray-400 mt-1">Generate a comprehensive ReportLab PDF summary integrating visual detections, audio transcripts, CCTV timelines, and chain-of-custody signatures.</p>
                                </div>

                                <div className="bg-forensic-900 border border-forensic-700 rounded-xl p-6 mb-8 space-y-4 font-mono text-xs">
                                    <div className="flex justify-between border-b border-forensic-800 pb-3">
                                        <span className="text-gray-400">Document Title:</span>
                                        <span className="text-gray-200 font-bold">CrimeVision AI Forensic Intelligence Dossier</span>
                                    </div>
                                    <div className="flex justify-between border-b border-forensic-800 pb-3">
                                        <span className="text-gray-400">Evidence ID / Case File:</span>
                                        <span className="text-cyan-400 font-bold">{evidenceId}</span>
                                    </div>
                                    <div className="flex justify-between border-b border-forensic-800 pb-3">
                                        <span className="text-gray-400">Lead Investigator:</span>
                                        <span className="text-emerald-400">{investigatorName}</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-gray-400">Cryptographic Seal:</span>
                                        <span className="text-emerald-400"><i className="fas fa-fingerprint"></i> SHA-256 Verified & Timestamped</span>
                                    </div>
                                </div>

                                <div className="flex justify-center gap-4">
                                    <button 
                                        onClick={() => notify('ReportLab PDF compiled successfully! Downloading forensic package...', 'success')}
                                        className="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl text-xs font-semibold shadow-lg shadow-blue-600/30 flex items-center space-x-2 transition-all"
                                    >
                                        <i className="fas fa-download"></i>
                                        <span>Download Official PDF Report</span>
                                    </button>
                                    <button 
                                        onClick={() => notify('Encrypted JSON bundle copied to clipboard.', 'info')}
                                        className="bg-forensic-700 hover:bg-forensic-600 text-gray-200 px-6 py-3 rounded-xl text-xs font-semibold border border-forensic-600 flex items-center space-x-2 transition-all"
                                    >
                                        <i className="fas fa-code"></i>
                                        <span>Export Raw JSON Ledger</span>
                                    </button>
                                </div>
                            </div>
                        )}

                    </div>

                    {/* Notification Toast */}
                    {notification && (
                        <Notification 
                            message={notification.message} 
                            type={notification.type} 
                            onClose={() => setNotification(null)} 
                        />
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
